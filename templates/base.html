<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Proyecto Agro{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        :root {
            --primary-color: #203145;
            /* Azul Corporativo */
            --accent-color: #27ae60;
            /* Verde Agro */
            --text-light: #ecf0f1;
        }

        body {
            padding-top: 76px;
            background-color: #f4f6f9;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- NAVBAR MODERNO --- */
        .navbar-custom {
            background-color: var(--primary-color) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            padding: 0.8rem 0;
        }

        .navbar-brand span {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
            font-size: 1.1rem;
            color: white;
            vertical-align: middle;
            margin-left: 8px;
        }

        .nav-link {
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75) !important;
            transition: all 0.3s ease;
            position: relative;
            margin: 0 5px;
        }

        .nav-link:hover,
        .nav-link.active {
            color: white !important;
            transform: translateY(-1px);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 50%;
            background-color: var(--accent-color);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .btn-nav-highlight {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 0.4rem 1.2rem !important;
        }

        .btn-nav-highlight:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .btn-nav-highlight::after {
            display: none;
        }

        /* --- FOOTER MODERNO --- */
        .footer-custom {
            background-color: var(--primary-color);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            border-top: 4px solid var(--accent-color);
        }

        .social-icon {
            font-size: 1.2rem;
            margin-left: 15px;
            color: white;
            transition: transform 0.2s;
        }

        .social-icon:hover {
            color: var(--accent-color);
            transform: scale(1.1);
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
        <div class="container-fluid px-4">

            <a class="navbar-brand p-0 d-flex align-items-center" href="{{ url_for('inicio') }}">
                <i class="bi bi-flower3 fs-2 text-white"></i>
                <span>AGRO<span style="color: var(--accent-color);">VISOR</span></span>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto align-items-center">
                    <a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a>
                    <a class="nav-link" href="{{ url_for('pagina_app') }}">App</a>
                </div>
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <footer class="footer-custom mt-auto py-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-12 text-center">
                    <p class="mb-0 fw-light">
                        © 2025 <strong>Proyecto Agro Visor</strong>. Innovación en tus cultivos.
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
